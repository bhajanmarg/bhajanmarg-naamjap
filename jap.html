<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Naam Jap - BhajanMarg</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#f7f4eb;
padding:20px;
color:#222;
}

.dark{
background:#111827;
color:white;
}

.container{
max-width:500px;
margin:auto;
}

.back-btn{
display:inline-block;
padding:10px 18px;
background:#ff9800;
color:white;
text-decoration:none;
border-radius:12px;
margin-bottom:15px;
font-weight:600;
}

.card{
background:white;
border-radius:30px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
text-align:center;
}

.dark .card{
background:#1f2937;
}

.jap-image{
width:100%;
max-width:320px;
height:320px;
object-fit:cover;
border-radius:25px;
display:block;
margin:auto;
box-shadow:0 10px 25px rgba(0,0,0,.15);
transition:.2s;
}

.jap-image.pulse{
transform:scale(1.04);
}

.jap-name{
font-size:30px;
font-weight:700;
margin-top:18px;
}

.count{
font-size:70px;
font-weight:700;
color:#ff9800;
margin-top:20px;
transition:.2s;
}

.count.animate{
transform:scale(1.15);
}

.mala{
font-size:20px;
margin-top:8px;
}

.progress{
width:100%;
height:14px;
background:#eee;
border-radius:20px;
margin-top:15px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#ff9800,#ff6f00);
transition:.3s;
}

.jap-btn{
width:100%;
padding:18px;
border:none;
border-radius:18px;
margin-top:20px;
background:linear-gradient(135deg,#ff9800,#ff6f00);
color:white;
font-size:22px;
font-weight:700;
cursor:pointer;
}

.jap-btn:active{
transform:scale(.96);
}

.reset-btn{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#e53935;
color:white;
margin-top:10px;
cursor:pointer;
font-size:16px;
}

.theme-btn{
position:fixed;
top:15px;
right:15px;
width:50px;
height:50px;
border:none;
border-radius:50%;
font-size:20px;
cursor:pointer;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

</style>
</head>

<body>

<button class="theme-btn" id="themeBtn">🌙</button>

<div class="container">

<a href="index.html" class="back-btn">
← Home
</a>

<div class="card">

<img
id="japImage"
class="jap-image"
src="assets/assets/radha.jpg">

<div
id="japName"
class="jap-name">
राधा रानी
</div>

<div
id="count"
class="count">
0
</div>

<div
id="mala"
class="mala">
0 / 108
</div>

<div class="progress">
<div class="fill" id="fill"></div>
</div>

<button
class="jap-btn"
id="japBtn">
📿 एक जाप
</button>

<button
class="reset-btn"
id="resetBtn">
Reset Count
</button>

</div>

</div>

<script>

const deityImages={
radha:"assets/assets/radha.jpg",
krishna:"assets/assets/krishna.jpg",
ram:"assets/assets/ram.jpg",
shiv:"assets/assets/shiv.jpg",
hanuman:"assets/assets/hanuman.jpg",
durga:"assets/assets/durga.jpg",
ganesh:"assets/assets/ganesh.jpg",
vishnu:"assets/assets/vishnu.jpg"
};

const deityNames={
radha:"राधा रानी",
krishna:"श्री कृष्ण",
ram:"श्री राम",
shiv:"महादेव",
hanuman:"हनुमान जी",
durga:"माँ दुर्गा",
ganesh:"श्री गणेश",
vishnu:"श्री विष्णु"
};

const deity=
localStorage.getItem("selectedDeity") || "radha";

document.getElementById("japImage").src=
deityImages[deity];

document.getElementById("japName").innerText=
deityNames[deity];

let count=
parseInt(localStorage.getItem("japCount")) || 0;

const countEl=
document.getElementById("count");

const malaEl=
document.getElementById("mala");

const fill=
document.getElementById("fill");

function updateCount(){

countEl.innerText=count;

const mala=count%108;

malaEl.innerText=
mala + " / 108";

fill.style.width=
(mala/108)*100 + "%";

}

updateCount();

document
.getElementById("japBtn")
.addEventListener("click",()=>{

count++;

localStorage.setItem(
"japCount",
count
);

updateCount();

countEl.classList.add("animate");

document
.getElementById("japImage")
.classList.add("pulse");

setTimeout(()=>{

countEl.classList.remove("animate");

document
.getElementById("japImage")
.classList.remove("pulse");

},200);

if(navigator.vibrate){

navigator.vibrate([80,40,80]);

}

});

document
.getElementById("resetBtn")
.addEventListener("click",()=>{

if(confirm("Count reset karna hai?")){

count=0;

localStorage.setItem(
"japCount",
0
);

updateCount();

}

});

document
.getElementById("themeBtn")
.addEventListener("click",()=>{

document.body.classList.toggle("dark");

});

</script>

</body>
</html>
