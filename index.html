<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BhajanMarg Naam Jap</title>

<style>
:root{
--bg:#fdf8ee;
--card:#ffffff;
--text:#222;
--gold:#d4af37;
--orange:#ff9800;
}

.dark{
--bg:#121212;
--card:#1e1e1e;
--text:#f5f5f5;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
transition:.3s;
padding-bottom:80px;
}

.header{
background:linear-gradient(135deg,#ffd54f,#ffb300);
padding:20px 15px;
text-align:center;
border-bottom-left-radius:20px;
border-bottom-right-radius:20px;
}

.gurudev{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:3px solid white;
}

.title{
font-size:28px;
font-weight:bold;
margin-top:10px;
}

.quote{
margin-top:5px;
font-size:14px;
}

.dark-btn{
margin-top:10px;
padding:8px 15px;
border:none;
border-radius:10px;
cursor:pointer;
}

.container{
max-width:500px;
margin:auto;
padding:15px;
}

.card{
background:var(--card);
border-radius:20px;
padding:20px;
box-shadow:0 2px 12px rgba(0,0,0,.1);
}

.deity-img{
width:220px;
height:220px;
object-fit:cover;
border-radius:20px;
display:block;
margin:auto;
}

.label{
text-align:center;
font-size:22px;
font-weight:bold;
margin:15px 0;
}

select{
width:100%;
padding:14px;
font-size:16px;
border-radius:12px;
border:1px solid #ccc;
}

.start-btn{
width:100%;
margin-top:15px;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
background:linear-gradient(135deg,#ffb300,#ff8f00);
color:white;
cursor:pointer;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.stat{
background:var(--card);
padding:15px;
border-radius:15px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.stat-num{
font-size:24px;
font-weight:bold;
color:#ff9800;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:var(--card);
display:flex;
justify-content:space-around;
padding:12px;
box-shadow:0 -2px 12px rgba(0,0,0,.1);
}

.nav{
text-align:center;
font-size:14px;
}

.footer{
text-align:center;
margin-top:15px;
opacity:.7;
}
</style>
</head>

<body>

<div class="header">

<img
src="assets/assets/gurudev.jpg"
class="gurudev"
alt="Gurudev">

<div class="title">
📿 BhajanMarg Naam Jap
</div>

<div class="quote">
हरि नाम ही जीवन का आधार है
</div>

<button class="dark-btn" onclick="toggleDark()">
🌙 Dark Mode
</button>

</div>

<div class="container">

<div class="card">

<img
id="deityPreview"
class="deity-img"
src="assets/assets/radha.jpg"
alt="Deity">

<div class="label">
नाम चुनें
</div>

<select id="naam" onchange="changeImage()">

<option value="radha">राधा</option>

<option value="krishna">श्री कृष्ण</option>

<option value="ram">श्री राम</option>

<option value="shiv">शिव</option>

<option value="hanuman">हनुमान</option>

<option value="durga">दुर्गा</option>

<option value="ganesh">गणेश</option>

<option value="vishnu">विष्णु</option>

</select>

<button
class="start-btn"
onclick="startJap()">

📿 जाप प्रारम्भ करें

</button>

</div>

<div class="stats">

<div class="stat">
<div class="stat-num">0</div>
<div>Active Users</div>
</div>

<div class="stat">
<div class="stat-num">0</div>
<div>Total Jap</div>
</div>

</div>

<div class="footer">
BhajanMarg.co
</div>

</div>

<div class="bottom-nav">

<div class="nav">🏠<br>Home</div>

<div class="nav">📿<br>Jap</div>

<div class="nav">🏆<br>Rank</div>

<div class="nav">👤<br>Profile</div>

</div>

<script>

function changeImage(){

let value =
document.getElementById("naam").value;

let image =
document.getElementById("deityPreview");

const paths = {

radha:"assets/assets/radha.jpg",

krishna:"assets/assets/krishna.jpg",

ram:"assets/assets/ram.jpg",

shiv:"assets/assets/shiv.jpg",

hanuman:"assets/assets/Hanuman.jpg",

durga:"assets/assets/Durga.jpg",

ganesh:"assets/assets/Ganesh.jpg",

vishnu:"assets/assets/vishnu.jpg"

};

image.src = paths[value];

}

function startJap(){

let naam =
document.getElementById("naam").value;

localStorage.setItem(
"selectedNaam",
naam
);

window.location.href="jap.html";

}

function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"theme",
document.body.classList.contains("dark")
?"dark":"light"
);

}

if(localStorage.getItem("theme")==="dark"){
document.body.classList.add("dark");
}

changeImage();

</script>

</body>
</html>
