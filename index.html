<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BhajanMarg Naam Jap</title>

<style>

:root{
 --primary:#7B001C;
 --gold:#D4AF37;
 --bg:#FFF8E8;
 --card:#ffffff;
 --text:#222;
}

.dark{
 --bg:#121212;
 --card:#1E1E1E;
 --text:#F5F5F5;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 transition:.3s;
}

header{
 background:linear-gradient(135deg,#7B001C,#4A0011);
 color:white;
 padding:25px 15px;
 text-align:center;
}

.logo{
 font-size:32px;
 margin-bottom:10px;
}

.subtitle{
 opacity:.9;
}

.topbar{
 display:flex;
 justify-content:flex-end;
 padding:15px;
}

.mode-btn{
 border:none;
 background:var(--gold);
 padding:10px 15px;
 border-radius:10px;
 cursor:pointer;
 font-weight:bold;
}

.container{
 max-width:500px;
 margin:auto;
 padding:20px;
}

.card{
 background:var(--card);
 padding:25px;
 border-radius:18px;
 box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.title{
 text-align:center;
 margin-bottom:20px;
}

select{
 width:100%;
 padding:14px;
 font-size:18px;
 border-radius:12px;
 border:2px solid #ddd;
}

.start-btn{
 width:100%;
 margin-top:20px;
 background:var(--primary);
 color:white;
 border:none;
 padding:15px;
 border-radius:12px;
 font-size:18px;
 cursor:pointer;
}

.stats{
 margin-top:25px;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.stat{
 background:var(--card);
 padding:15px;
 border-radius:12px;
 text-align:center;
}

.number{
 font-size:24px;
 font-weight:bold;
 color:var(--primary);
}

.footer{
 text-align:center;
 margin-top:30px;
 opacity:.8;
 font-size:14px;
}

</style>
</head>

<body>

<div class="topbar">
<button class="mode-btn" onclick="toggleDark()">
🌙 Dark Mode
</button>
</div>

<header>
<div class="logo">📿 BhajanMarg</div>
<h1>Naam Jap</h1>
<p class="subtitle">
हरि नाम ही जीवन का आधार है
</p>
</header>

<div class="container">

<div class="card">

<h2 class="title">नाम चुनें</h2>

<select id="naam">
<option>राधा</option>
<option>श्री कृष्ण</option>
<option>श्री राम</option>
<option>शिव</option>
<option>हनुमान</option>
<option>दुर्गा</option>
<option>गणेश</option>
<option>विष्णु</option>
</select>

<button class="start-btn" onclick="startJap()">
📿 जाप प्रारम्भ करें
</button>

</div>

<div class="stats">

<div class="stat">
<div class="number">0</div>
<div>Active Users</div>
</div>

<div class="stat">
<div class="number">0</div>
<div>Total Jap</div>
</div>

</div>

<div class="footer">
BhajanMarg.co
</div>

</div>

<script>

function startJap(){
let naam=document.getElementById("naam").value;
localStorage.setItem("selectedNaam",naam);
window.location.href="jap.html";
}

function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"theme",
document.body.classList.contains("dark")
?"dark":"light"
);

}

if(localStorage.getItem("theme")==="dark"){
document.body.classList.add("dark");
}

</script>

</body>
</html>
